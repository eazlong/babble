[pytest]
asyncio_mode = auto
pythonpath = .
# 只收集 tests/：scripts/test_xfyun.py 是手动脚本（会真加载 Whisper 模型、需要讯飞凭据），
# 不是单元测试。它此前被默认收集，在干净环境下必然失败（WHISPER_CACHE=/models 不可写）。
# 需要时显式跑：.venv/bin/python -m pytest scripts/test_xfyun.py
testpaths = tests
markers =
    integration: integration tests requiring real external credentials/network
    intent_eval: 真实模型的意图判定评测（消耗预算，需 INTENT_EVAL_LIVE=1 显式开启）
