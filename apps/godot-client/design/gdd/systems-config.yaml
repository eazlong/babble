## LXP Assessment Configuration

```typescript
const LXP_CONFIG = {
  // 权重（确保总和=1.0）
  weights: {
    accuracy: 0.4,
    fluency: 0.3,
    vocabulary: 0.3,
  },

  // 目标语速（四年级中国儿童 ESL）
  wpm_target: 60,
  wpm_tolerance: 0.25,  // 25%容忍度

  // 停顿惩罚
  pause_penalty: 15,    // 每次停顿扣15分

  // 重试惩罚
  retry_penalty: {
    step: 0.1,         // 每次尝试-10%
    min: 0.7,          // 最低70%
  },

  // 保底分数（第3次尝试）
  min_score_retry_3: 30,

  // 边界保护（防止除以零）
  zero_phoneme_fallback: 0,  // ASR返回空时返回0分，不崩溃
};
```

