## Star Economy Configuration

```typescript
const STAR_ECONOMY_CONFIG = {
  // 阈值（从动态改为固定，避免目标不清晰）
  badge_threshold: {
    SpiritForest: 15,
    SpellLibrary: 18,
    RainbowGarden: 20,
  },

  // LXP 到星星映射（统一）
  star_mapping: {
    threshold_1: 40,   // 1星
