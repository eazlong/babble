## 数据类型定义

```typescript
// 所有系统共享的通用类型

interface PlayerSession {
  session_id: string;
  player_id: string;
  start_time: string;
  max_duration_min: number;
  scenes_completed: string[];
  total_stars_earned: number;
}

interface SceneProgress {
  scene_id: string;
  player_id: string;
  stars_accumulated: number;
  badge_unlocked: boolean;
  last_updated: string;
}

interface StarTransaction {
  transaction_id: string;
  player_id: string;
  scene_id: string;
  delta: number;           // 正数=获得，负数=消费
  reason: 'earned' | 'spent' | 'refunded';
  balance_after: number; // 玩家总星星余额
  timestamp: string;
}

interface LXPTransaction {
  transaction_id: string;
  player_id: string;
  source: 'scene' | 'daily_quest' | 'badge' | 'treasure_box';
  amount: number;
  timestamp: string;
}
```
