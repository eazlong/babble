# LinguaQuest RPG 统一系统配置

**版本**: 1.0
**日期**: 2026-06-25
**用途**: 跨系统共享配置，确保 quest-system、star-economy、spirit-coach 等系统定义一致

---

## Player Difficulty / Struggle Score

**单一源头**: `assessment-service` 计算并发布事件

```typescript
// 统一困难指标计算（所有系统共享此定义）
interface PlayerStruggleScore {
  score: number;        // 0.0 - 1.0
  components: {
    consecutive_low_lxp: boolean;   // LXP < 40 连续3次
    consecutive_errors: boolean;    // 语法/发音错误连续3次
    asr_failure_rate: boolean;      // ASR 置信度 < 0.3 比例 > 50%
  };
  timestamp: string;
}

// 计算公式
function calculateStruggleScore(input: StruggleInput): number {
  const sLxp = input.consecutive_low_lxp ? 1 : 0;
  const sError = input.consecutive_errors ? 1 : 0;
  const sAsr = input.asr_failure_rate ? 1 : 0;
  return (sLxp + sError + sAsr) / 3;
}

// 触发阈值（统一）
const STRUGGLE_THRESHOLD: number = 0.67;

// 触发后行为（各系统订阅同一事件执行）
interface StruggleTriggeredEvent {
  event_type: 'struggle_threshold_breached';
  player_id: string;
  struggle_score: number;
  triggered_systems: ['spirit-coach', 'quest-system', 'star-economy'];
  actions: {
    spirit_coach: 'intervention_prompt';      // Spark介入提示
    quest_system: 'difficulty_downgrade';    // 任务难度降低一级
    star_economy: 'floor_increase_to_2';      // 保底星星提升到2星
  };
}
```

**职责分配**:
- `assessment-service`: 唯一计算源头，发布事件到 Redis
- `spirit-coach-service`: 订阅事件，触发 Spark 介入
- `quest-service`: 订阅事件，降低任务难度
- `star-economy`: 订阅事件，提升保底星星

