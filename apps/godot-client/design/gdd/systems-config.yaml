## 跨系统一致性检查清单

修改任何配置时，必须更新以下文档：

1. **修改 `struggle_score` 阈值** → 更新:
   - `spirit-coach.md`
   - `quest-system.md`
   - `star-economy.md`

2. **修改会话时长** → 更新:
   - `game-concept.md`
   - `core-loop.md`
   - `quest-system.md`

3. **修改星星阈值** → 更新:
   - `game-concept.md`
   - `star-economy.md`
   - `quest-system.md`

4. **修改 LXP 权重** → 更新:
   - `lxp-system.md`
   - `star-economy.md`

