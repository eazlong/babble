services:
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linguaquest
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  # F5-TTS runs locally on Mac via MLX (not Docker-compatible on ARM64)
  # Start manually: .venv/bin/python services/f5-tts-server/main.py
  # f5-tts:
  #   build: ./services/f5-tts-server
  #   ports: ["8002:8002"]
  #   environment:
  #     F5_STEPS: 2
  #     F5_METHOD: euler

  dialogue-service:
    build: ./services/dialogue-service
    ports: ["8302:8302"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/linguaquest
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]

  voice-service:
    build: ./services/voice-service
    ports: ["8301:8301"]
    env_file:
      - ./services/voice-service/.env
    environment:
      FISH_SPEECH_URL: ${FISH_SPEECH_URL:-http://host.docker.internal:8002}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - ./services/voice-service/src:/app/src:ro
      - whisper_cache:/models/whisper
    depends_on: [redis]

  spirit-coach-service:
    build: ./services/spirit-coach-service
    ports: ["8305:8305"]
    env_file:
      - ./services/spirit-coach-service/.env

    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  summary-service:
    build: ./services/summary-service
    ports: ["8303:8303"]
    env_file:
      - ./services/summary-service/.env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:5433}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      ASSESSMENT_SERVICE_URL: ${ASSESSMENT_SERVICE_URL:-http://host.docker.internal:8308}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL:-http://voice-service:8301}
    volumes:
      - ./services/summary-service/src:/app/src:ro
    depends_on: [postgres]

  # 家长控制台依赖：auth-service（认证 + 家长 API 代理，内部跑在 8303）
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports: ["8310:8303"]
    environment:
      # auth-service 监听 8303，直连 compose 的 postgres（原 Supabase 已移除）
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/linguaquest}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SUMMARY_SERVICE_URL: ${SUMMARY_SERVICE_URL:-http://summary-service:8303}
    depends_on: [postgres]

  # 家长控制台 web (Next.js standalone)
  # Dockerfile 以仓库根为 build context，因为它需要 workspace 各 importer 的 package.json 来满足 pnpm --frozen-lockfile
  parent-dashboard:
    build:
      context: .
      dockerfile: apps/parent-dashboard/Dockerfile
      args:
        # NEXT_PUBLIC_* 在 next build 期内联进浏览器 bundle，故作为 build arg 传入。
        # 浏览器在宿主侧运行，需经 auth-service 的宿主映射端口 8310 访问。
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8310/api/v1}
    ports: ["3333:3333"]
    environment:
      PORT: 3333
      HOSTNAME: "0.0.0.0"
    depends_on:
      - auth-service

volumes:
  pgdata:
  whisper_cache:
