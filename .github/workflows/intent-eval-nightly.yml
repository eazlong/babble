name: Intent Eval (nightly)

# 目标意图判定的真实模型评测：N=5 全量 + 双门禁（最差桶准确率 + 抖动率）。
# 计划文档：docs/plans/2026-09-15-intent-accuracy.md
# 评测集说明：services/voice-service/tests/intent_eval/README.md
#
# 需要的仓库 secrets：
#   ASR_POSTPROCESS_BASE_URL  ← **必须带 /v1**（少了它网关会返回站点首页 HTML，评测全绿不了也全红得莫名其妙）
#   ASR_POSTPROCESS_API_KEY
#   ASR_POSTPROCESS_MODEL
# 未配置时本工作流只发一条 warning 并跳过，不会红。

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00（错开白天开发时段）
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  intent-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASR_POSTPROCESS_BASE_URL: ${{ secrets.ASR_POSTPROCESS_BASE_URL }}
      ASR_POSTPROCESS_API_KEY: ${{ secrets.ASR_POSTPROCESS_API_KEY }}
      ASR_POSTPROCESS_MODEL: ${{ secrets.ASR_POSTPROCESS_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/voice-service/requirements-eval.txt

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$ASR_POSTPROCESS_API_KEY" ] || [ -z "$ASR_POSTPROCESS_BASE_URL" ]; then
            echo "::warning::未配置 ASR_POSTPROCESS_API_KEY / ASR_POSTPROCESS_BASE_URL，跳过 nightly 评测"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install eval deps（轻量，不含 ASR/TTS 引擎）
        if: steps.creds.outputs.ready == 'true'
        run: pip install -r services/voice-service/requirements-eval.txt

      - name: Run N=5 intent eval（双门禁 + 费用闸门）
        if: steps.creds.outputs.ready == 'true'
        working-directory: services/voice-service
        run: bash scripts/run_nightly_intent_eval.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-eval-report
          path: services/voice-service/tests/intent_eval/reports/
          if-no-files-found: ignore

      - name: Explain failure
        if: failure()
        run: |
          echo "::error::nightly 意图判定评测门禁失败：某桶退步超过 2pt 或抖动率上升超过 2pt。"
          echo "不要顺手更新 baseline。先看 artifact 里的 report JSON 定位是哪个桶、哪些用例翻转，"
          echo "按 docs/plans/2026-09-15-intent-accuracy.md §4 的批次循环处理。"
